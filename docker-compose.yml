services:
  postgres:
    image: postgres:17-alpine
    container_name: yuva-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: yuva
      POSTGRES_PASSWORD: yuva
      POSTGRES_DB: yuva_polyprint
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yuva -d yuva_polyprint']
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: yuva-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
