name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: yuva
          POSTGRES_PASSWORD: yuva
          POSTGRES_DB: yuva_polyprint_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U yuva"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://yuva:yuva@localhost:5432/yuva_polyprint_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-that-is-long-enough-for-validation
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-long-enough-for-validation
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @yuva/shared

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
