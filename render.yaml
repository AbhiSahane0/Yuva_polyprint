# Render Blueprint — https://render.com/docs/blueprint-spec
#
# In Render: New -> Blueprint -> pick this repository. Render reads this file
# and creates the service; you then fill in the three secret values below.
#
# Deployed as Docker rather than Render's native Node runtime because the
# quotation PDF needs Chromium, and the image installs and wires it up.

services:
  - type: web
    name: yuva-polyprint-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    # All three must stay at the repository root. This is a monorepo: the API
    # build needs the root package-lock.json and packages/shared, both of which
    # live ABOVE apps/api. Setting rootDir to apps/api makes the build context
    # apps/api, and then every COPY in the Dockerfile fails with "not found" —
    # rootDir also scopes autoDeploy, so shared-package changes stop triggering
    # builds.
    rootDir: .
    dockerContext: .
    plan: free
    # Neon is in us-east-2 (Ohio). Same region keeps database round-trips short,
    # which matters most for the quotation screens.
    region: ohio
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: LOG_LEVEL
        value: info
      # Dates are the office's, not the server's. Without this Render runs UTC
      # and "today" would not roll over until 05:30 local.
      - key: TZ
        value: Asia/Kolkata

      # Set these in the Render dashboard — `sync: false` means Render prompts
      # for them and never stores them in the repository.
      #
      #   DATABASE_URL   Neon pooled endpoint  (host contains "-pooler")
      #   DIRECT_URL     Neon direct endpoint  — migrations run on boot and
      #                  cannot use a pooled connection
      #   CORS_ORIGINS   only needed if the browser calls this API directly.
      #                  With the Vercel rewrite in vercel.json it does not:
      #                  requests arrive from Vercel's edge, same-origin to the
      #                  browser, carrying no Origin header at all. Leave it as
      #                  the localhost default unless you switch to direct
      #                  calls. If you do, entries accept `*` within a hostname
      #                  label, so one pattern covers every preview URL:
      #                    https://app.vercel.app,https://app-*.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

      #   RESEND_API_KEY Optional. Without it the app runs normally and only
      #                  "send quotation" reports that email is unavailable.
      - key: RESEND_API_KEY
        sync: false

      # The sender, and where a reply lands. Fixed here rather than prompted,
      # now that yuvapolyprint.com is verified with Resend.
      #
      # It was prompted while the right answer still differed per environment.
      # It no longer does, and the failure it now prevents is the expensive
      # one: production quietly kept sending from a domain belonging to an
      # unrelated project, and a six-figure quotation arriving from somebody
      # else's domain does not get queried — it gets ignored.
      #
      # Neither is a secret. The reply-to matters because the accept page tells
      # the customer to reply to the mail it came with, so it has to be a box
      # somebody reads.
      - key: MAIL_FROM
        value: Yuva Polyprint & Packaging <info@yuvapolyprint.com>
      - key: MAIL_REPLY_TO
        value: info@yuvapolyprint.com

      #   GSTIN_API_KEY  Optional, and optional in the same way email is: without
      #                  it the app runs normally and only the "Verify" button on
      #                  a GST number reports itself unavailable. The offline
      #                  format and check-digit validation is unaffected — that
      #                  half needs no network and catches every realistic typo.
      #                  Each lookup spends a paid credit, so this is prompted
      #                  rather than committed.
      - key: GSTIN_API_KEY
        sync: false
      # Not a secret, and the apex domain on purpose: api.gstinapi.in does not
      # resolve at all. Fixed here so a redeploy cannot silently pick up a
      # different default.
      - key: GSTIN_API_BASE_URL
        value: https://gstinapi.in

      # ---- The customer's accept link ------------------------------------
      #
      #   PUBLIC_APP_URL   The public origin of the WEB app — where the link
      #                    in a quotation email points. NOT this API: the
      #                    customer must land on a page, not on JSON.
      #
      #                    **Set this before the first quotation goes out.**
      #                    Unset, the app falls back to localhost and the
      #                    link is minted, recorded and emailed before anybody
      #                    notices it opens nothing. There is no error — the
      #                    customer simply cannot answer.
      #
      #   OFFICE_ALERT_EMAIL / OFFICE_WHATSAPP
      #                    Where the works is told a customer has answered.
      #                    Optional: without them the acceptance is still
      #                    recorded and still shows on the quotation screen,
      #                    and only the nudge is missing.
      #
      # Fixed rather than prompted, because the thing it guards against is
      # silence: unset, it falls back to localhost and the link is minted,
      # recorded and emailed with no error at all. A deploy that cannot
      # forget it is worth more than the flexibility of a prompt. Change it
      # here when the web app moves to a domain of its own.
      - key: PUBLIC_APP_URL
        value: https://yuva-polyprint.vercel.app
      - key: OFFICE_ALERT_EMAIL
        sync: false
      - key: OFFICE_WHATSAPP
        sync: false

      # ---- WhatsApp, through Twilio --------------------------------------
      #
      # All three of SID, token and from-number, or none of them: the app
      # refuses to boot half-configured rather than failing at the first
      # message with an authentication error nobody traces back to here.
      #
      # A real WhatsApp Business Account is needed for real customers, and
      # Meta must approve each template in advance — docs/whatsapp-templates.md
      # has the text to submit and the order to do it in. Without the template
      # SIDs the app sends plain text, which Twilio's sandbox accepts and a
      # real number refuses with code 63016.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: TWILIO_TEMPLATE_QUOTATION_SENT
        sync: false
      - key: TWILIO_TEMPLATE_QUOTATION_ACCEPTED
        sync: false
