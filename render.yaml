# Render Blueprint — https://render.com/docs/blueprint-spec
#
# In Render: New -> Blueprint -> pick this repository. Render reads this file
# and creates the service; you then fill in the three secret values below.
#
# Deployed as Docker rather than Render's native Node runtime because the
# quotation PDF needs Chromium, and the image installs and wires it up.

services:
  - type: web
    name: yuva-polyprint-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    # All three must stay at the repository root. This is a monorepo: the API
    # build needs the root package-lock.json and packages/shared, both of which
    # live ABOVE apps/api. Setting rootDir to apps/api makes the build context
    # apps/api, and then every COPY in the Dockerfile fails with "not found" —
    # rootDir also scopes autoDeploy, so shared-package changes stop triggering
    # builds.
    rootDir: .
    dockerContext: .
    plan: free
    # Neon is in us-east-2 (Ohio). Same region keeps database round-trips short,
    # which matters most for the quotation screens.
    region: ohio
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: LOG_LEVEL
        value: info
      # Dates are the office's, not the server's. Without this Render runs UTC
      # and "today" would not roll over until 05:30 local.
      - key: TZ
        value: Asia/Kolkata

      # Set these in the Render dashboard — `sync: false` means Render prompts
      # for them and never stores them in the repository.
      #
      #   DATABASE_URL   Neon pooled endpoint  (host contains "-pooler")
      #   DIRECT_URL     Neon direct endpoint  — migrations run on boot and
      #                  cannot use a pooled connection
      #   CORS_ORIGINS   only needed if the browser calls this API directly.
      #                  With the Vercel rewrite in vercel.json it does not:
      #                  requests arrive from Vercel's edge, same-origin to the
      #                  browser, carrying no Origin header at all. Leave it as
      #                  the localhost default unless you switch to direct
      #                  calls. If you do, entries accept `*` within a hostname
      #                  label, so one pattern covers every preview URL:
      #                    https://app.vercel.app,https://app-*.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

      #   RESEND_API_KEY Optional. Without it the app runs normally and only
      #                  "send quotation" reports that email is unavailable.
      #   MAIL_FROM      The sender. Prompted rather than fixed here because the
      #                  right value differs per environment and changes the
      #                  moment a Yuva domain is verified — a default committed
      #                  today would quietly outlive its usefulness.
      #                  onboarding@resend.dev delivers ONLY to the Resend
      #                  account owner; a real customer needs an address on a
      #                  domain verified with Resend.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
